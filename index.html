<!DOCTYPE html>
<html lang="uk">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Книги</title><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bad+Script&family=Caveat:wght@400;600&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Marck+Script&family=Neucha&family=Pirata+One&family=Ruslan+Display&family=Ubuntu+Sans+Mono:wght@400;500&family=Yeseva+One&display=swap" rel="stylesheet">
</head>
<body>
  <div id="gm">
    <div class="row">
      <select id="pick"></select>
      <button type="button" id="add" title="Нова книга">+</button>
    </div>

    <div id="editor" hidden>
      <input id="title" placeholder="Назва книги" maxlength="60" style="margin-top:10px">
      <div class="grid2" style="margin-top:8px">
        <select id="style"></select>
        <select id="font"></select>
      </div>
      <div class="preview" id="preview">Аа Бб Вв — так виглядатиме текст</div>

      <div class="pagebar">
        <button type="button" id="prev">‹</button>
        <span id="counter">1 / 1</span>
        <button type="button" id="next">›</button>
        <button type="button" id="addPage" class="ghost">Додати сторінку</button>
        <button type="button" id="delPage" class="ghost">Прибрати</button>
      </div>

      <textarea id="text" placeholder="Текст сторінки…"></textarea>

      <div class="row" style="margin-top:8px">
        <button type="button" id="save">Зберегти</button>
        <button type="button" id="show" class="ghost">Показати всім</button>
        <button type="button" id="del" class="ghost">Видалити книгу</button>
      </div>
    </div>

    <div class="hint" id="hint"></div>
  </div>

  <div id="player" hidden class="hint">Книги пише Майстер. Знайдену книгу відкривають через ПКМ на предметі.</div>
  <script type="module" src="/src/editor.js"></script>
</body>
</html>
